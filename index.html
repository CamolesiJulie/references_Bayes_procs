<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>References</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #525659; height: 100vh; display: flex; flex-direction: column; }
    #toolbar {
      background: #323639;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #toolbar a {
      color: #fff;
      font-family: sans-serif;
      font-size: 14px;
      text-decoration: none;
      background: #0078d4;
      padding: 6px 14px;
      border-radius: 4px;
    }
    #toolbar span { color: #ccc; font-family: sans-serif; font-size: 14px; }
    iframe { flex: 1; border: none; width: 100%; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span>📄 References — Bayesian Calibration</span>
    <a href="references.pdf" download>⬇ Download PDF</a>
  </div>

  <!-- Tenta embed nativo primeiro; fallback para Google Docs Viewer -->
  <iframe
    src="https://docs.google.com/gview?url=https://camolesijulie.github.io/references_Bayes_procs/references.pdf&embedded=true"
    title="PDF Viewer">
  </iframe>
</body>
</html>
